<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#e9dfc7">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%275%27 fill=%27%23b1402c%27/%3E%3Cpath d=%27M6 22l6-9 4 5 3-4 7 8z%27 fill=%27%23f6ecde%27/%3E%3C/svg%3E">
<title>山河诗卷</title>
<meta name="description" content="三维水墨体素山河上的诗词地图：先秦至宋三百余首诗词，落在一百五十余处地标上。">
<style>
:root{
  --silk:#f3ebd7; --silk2:#e8dcc0; --silk-a:rgba(246,239,222,.86);
  --ink:#27231f; --ink2:#554c42; --ink3:#8a7d6c;
  --zhu:#b1402c; --zhu2:#c8583f; --qing:#2d5d71; --lu:#4b8670;
  --line:rgba(60,48,36,.16);
  /* 全站统一一种楷体（系统自带，不联网） */
  --kai:"KaiTi","STKaiti","Kaiti SC","Kaiti TC","楷体","楷体_GB2312","AR PL UKai CN","TW-Kai","BiauKai",serif;
  --serif:var(--kai); --brush:var(--kai);
  --r:14px; --shadow:0 10px 34px rgba(40,30,18,.18),0 2px 6px rgba(40,30,18,.08);
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#e7ddc6;color:var(--ink);font-family:var(--serif);-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
#scene{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none;cursor:grab}
#scene.grabbing{cursor:grabbing}
#scene.pointing{cursor:pointer}

/* ———— 地名签 ———— */
#labels{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:2;transition:opacity .5s}
.lbl{position:absolute;left:0;top:0;width:0;height:0;opacity:0;transition:opacity .35s ease;will-change:transform}
.lbl .in{position:absolute;left:-14px;bottom:-4px;width:28px;display:flex;flex-direction:column;align-items:center;gap:3px;pointer-events:auto;cursor:pointer;padding:3px 0 0}
.lbl .dot{margin-top:1px}
.lbl i.stem{width:1px;height:10px;background:linear-gradient(rgba(177,64,44,.7),rgba(177,64,44,0));margin-top:-2px;margin-bottom:-6px}
.lbl.on{opacity:1}
.lbl:not(.on) .in{pointer-events:none}
.lbl .dot{width:7px;height:7px;border-radius:50%;background:var(--zhu);box-shadow:0 0 0 2px rgba(246,239,222,.85),0 1px 3px rgba(0,0,0,.25)}
.lbl span{writing-mode:vertical-rl;font-size:13px;letter-spacing:2px;line-height:1;color:var(--ink);
  text-shadow:0 0 3px rgba(246,239,222,.95),0 0 8px rgba(246,239,222,.85),0 0 1px rgba(246,239,222,1)}
.lbl.major span{font-size:16px;color:#1c1916}
.lbl b{font-weight:400;font-size:11px;line-height:1;color:#fff;background:var(--zhu);border-radius:3px;padding:2px 3px}
.lbl:hover .dot,.lbl.sel .dot{transform:scale(1.5);background:var(--zhu2)}
.lbl.sel span{color:var(--zhu)}
.night .lbl span{color:#f4ead3;text-shadow:0 0 4px rgba(10,16,30,.95),0 0 10px rgba(10,16,30,.7)}

/* ———— 通用浮层 ———— */
.chrome{position:fixed;z-index:5;transition:opacity .45s ease,transform .45s ease}
body.ui-hidden .chrome,body.ui-hidden #labels{opacity:0;pointer-events:none}
body.ui-hidden .chrome *{pointer-events:none}

#brand{top:max(16px,env(safe-area-inset-top));left:18px;display:flex;gap:12px;align-items:flex-start;pointer-events:none}
.seal{width:40px;height:40px;background:var(--zhu);color:#f7eee0;display:grid;place-items:center;font-family:var(--brush);
  font-size:26px;border-radius:5px;box-shadow:inset 0 0 0 2px rgba(255,240,220,.35),0 3px 10px rgba(120,30,20,.25);flex:none}
#brand h1{margin:0;font-family:var(--brush);font-weight:400;font-size:34px;line-height:1;letter-spacing:4px;color:var(--ink);
  text-shadow:0 0 12px rgba(246,239,222,.9)}
#brand p{margin:6px 0 0;font-size:12px;letter-spacing:2px;color:var(--ink2);text-shadow:0 0 8px rgba(246,239,222,.95)}
.night #brand h1,.night #brand p{color:#efe4cb;text-shadow:0 0 10px rgba(10,16,30,.8)}

#search{top:max(16px,env(safe-area-inset-top));right:18px;width:min(300px,calc(100vw - 36px))}
#search .box{display:flex;align-items:center;gap:8px;height:40px;padding:0 12px;border-radius:20px;background:var(--silk-a);
  backdrop-filter:blur(10px) saturate(1.2);-webkit-backdrop-filter:blur(10px) saturate(1.2);box-shadow:var(--shadow);border:1px solid rgba(255,255,255,.5)}
#search input{flex:1;min-width:0;border:0;background:transparent;outline:none;font:inherit;font-size:14px;color:var(--ink)}
#search input::placeholder{color:var(--ink3)}
#search svg{flex:none;opacity:.6}
#results{margin-top:6px;border-radius:12px;background:var(--silk-a);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  box-shadow:var(--shadow);overflow:hidden;display:none;max-height:min(60vh,420px);overflow-y:auto}
#results.on{display:block}
#results button{display:block;width:100%;text-align:left;border:0;background:transparent;padding:9px 14px;cursor:pointer;border-bottom:1px solid var(--line)}
#results button:last-child{border-bottom:0}
#results button:hover,#results button.hl{background:rgba(177,64,44,.08)}
#results .t{font-size:14px}
#results .s{font-size:12px;color:var(--ink3);margin-top:2px}

/* ———— 底部控制条 ———— */
#dock{left:16px;bottom:calc(16px + var(--safe-b));display:flex;flex-wrap:wrap;gap:8px;align-items:center;max-width:calc(100vw - 32px)}
.grp{display:flex;align-items:center;gap:2px;padding:4px;border-radius:22px;background:var(--silk-a);
  backdrop-filter:blur(10px) saturate(1.2);-webkit-backdrop-filter:blur(10px) saturate(1.2);box-shadow:var(--shadow);border:1px solid rgba(255,255,255,.5)}
.grp .lab{font-size:11px;color:var(--ink3);padding:0 6px 0 8px;letter-spacing:1px;writing-mode:horizontal-tb}
.chip{border:0;background:transparent;height:32px;min-width:40px;padding:0 10px;border-radius:16px;cursor:pointer;font-size:14px;letter-spacing:1px;color:var(--ink2);transition:background .2s,color .2s}
.chip:hover{background:rgba(60,48,36,.07);color:var(--ink)}
.chip.on{background:var(--ink);color:var(--silk)}
.ico{border:0;background:transparent;width:36px;height:32px;border-radius:16px;display:grid;place-items:center;cursor:pointer;color:var(--ink2);transition:background .2s,color .2s}
.ico:hover{background:rgba(60,48,36,.08);color:var(--ink)}
.ico.on{background:var(--zhu);color:#fff}
.ico svg{width:18px;height:18px}
.ico .q{font-size:15px}
body.panel-open #search{opacity:0;pointer-events:none}
#showUi{position:fixed;right:16px;bottom:calc(16px + var(--safe-b));z-index:6;opacity:0;pointer-events:none;transition:opacity .4s}
body.ui-hidden #showUi{opacity:.55;pointer-events:auto}
#showUi:hover{opacity:1}

#hint{right:18px;bottom:calc(20px + var(--safe-b));font-size:12px;color:var(--ink2);letter-spacing:1px;text-shadow:0 0 8px rgba(246,239,222,.95);pointer-events:none}
.night #hint{color:#e6dcc4;text-shadow:0 0 8px rgba(0,0,0,.6)}
#hint.gone{opacity:0}

#toast{left:50%;top:78px;transform:translate(-50%,-8px);padding:8px 16px;border-radius:18px;background:rgba(39,35,31,.86);color:var(--silk);
  font-size:13px;letter-spacing:1px;opacity:0;pointer-events:none}
#toast.on{opacity:1;transform:translate(-50%,0)}

/* ———— 诗目：一处多诗时先列目 ———— */
#plist{position:fixed;z-index:9;left:0;top:0;width:272px;max-height:min(58vh,460px);display:flex;flex-direction:column;
  background:linear-gradient(180deg,#f7f0de,#efe5cc);color:var(--ink);border-radius:3px;padding:16px 8px 10px 14px;
  box-shadow:0 16px 40px rgba(40,28,14,.3),0 0 0 1px rgba(120,80,40,.2);opacity:0;pointer-events:none;
  transition:opacity .25s ease;will-change:transform}
#plist::before{content:"";position:absolute;inset:6px;border:1px solid rgba(177,64,44,.5);box-shadow:0 0 0 2px #f3ead3,0 0 0 3px rgba(177,64,44,.25);pointer-events:none}
#plist.on{opacity:1;pointer-events:auto}
.pl-h{position:relative;display:flex;flex-direction:column;gap:3px;padding:0 34px 9px 8px;border-bottom:1px solid rgba(177,64,44,.25)}
.pl-n{font-size:23px;letter-spacing:4px}
.pl-r{font-size:12.5px;color:var(--ink3);letter-spacing:1px}
.pl-x{position:absolute;right:2px;top:-6px;width:32px;height:32px;border:0;background:none;font:inherit;font-size:20px;color:var(--ink3);cursor:pointer}
.pl-x:hover{color:var(--zhu)}
#plo{list-style:none;margin:6px 0 0;padding:0 6px 0 0;overflow-y:auto;scrollbar-width:thin;scrollbar-color:rgba(120,80,40,.3) transparent}
#plo button{display:flex;align-items:baseline;gap:10px;width:100%;text-align:left;border:0;background:none;padding:8px 8px;cursor:pointer;border-radius:2px;font:inherit;color:var(--ink)}
#plo button:hover,#plo button:focus-visible{background:rgba(177,64,44,.09);outline:none}
#plo .no{flex:none;font-size:13px;color:var(--zhu);min-width:2.2em}
#plo .t{font-size:17px;letter-spacing:1px}
#plo .a{margin-left:auto;flex:none;padding-left:8px;font-size:13px;color:var(--ink3);white-space:nowrap}
#plist .hint{font-size:11.5px;color:var(--ink3);text-align:center;padding-top:6px;letter-spacing:2px}

/* ———— 诗卷：立轴装裱（天杆 · 惊燕 · 天头 · 隔水 · 画心 · 地头 · 地杆） ———— */
#scroll{position:fixed;z-index:10;top:66px;right:34px;width:min(440px,calc(100vw - 48px));height:calc(100vh - 150px);
  display:flex;flex-direction:column;align-items:center;visibility:hidden;pointer-events:none;
  filter:drop-shadow(0 20px 26px rgba(30,20,10,.32)) drop-shadow(0 2px 3px rgba(30,20,10,.2))}
#scroll.on{visibility:visible;pointer-events:auto}
.rod{position:relative;flex:none;z-index:2;border-radius:6px;background:linear-gradient(180deg,#8a5d3f 0%,#5a3924 42%,#301d12 100%);box-shadow:inset 0 1px 0 rgba(255,225,190,.35)}
.rod.top{height:12px;width:calc(100% + 8px)}
.rod.bot{height:18px;width:calc(100% + 14px);border-radius:9px}
.rod.bot::before,.rod.bot::after{content:"";position:absolute;top:-3px;width:18px;height:24px;border-radius:6px;
  background:linear-gradient(90deg,#b8ab8c,#f4eedc 45%,#cfc4a7 70%,#a99c7e);box-shadow:0 1px 3px rgba(0,0,0,.35)}
.rod.bot::before{left:-15px}.rod.bot::after{right:-15px}
.rod .hook{position:absolute;left:50%;bottom:100%;width:64px;height:22px;margin-left:-32px;
  background:linear-gradient(to top right,transparent calc(50% - .8px),#5b4332 50%,transparent calc(50% + .8px)) left/50% 100% no-repeat,
             linear-gradient(to top left,transparent calc(50% - .8px),#5b4332 50%,transparent calc(50% + .8px)) right/50% 100% no-repeat}
.rod .hook::after{content:"";position:absolute;left:50%;top:-4px;width:7px;height:7px;margin-left:-3.5px;border-radius:50%;background:#b1402c}
.mount{position:relative;flex:1;min-height:0;width:100%;display:flex;flex-direction:column;padding:0 16px;
  background:
    repeating-linear-gradient(45deg,rgba(255,255,255,.07) 0 2px,transparent 2px 9px),
    repeating-linear-gradient(-45deg,rgba(40,70,55,.07) 0 2px,transparent 2px 9px),
    radial-gradient(circle at 50% 50%,rgba(255,255,255,.12) 0 2px,transparent 3px) 0 0/18px 18px,
    linear-gradient(90deg,#9fb5a3,#b3c6b4 50%,#9fb5a3)}
.tian{position:relative;flex:none;height:64px}
.tian::after,.di::before{content:"";position:absolute;left:0;right:0;height:9px;background:linear-gradient(180deg,#d9cba5,#e6dab8);box-shadow:inset 0 0 0 1px rgba(120,90,50,.2)}
.tian::after{bottom:0}.di::before{top:0}
.yan{position:absolute;top:0;width:13px;height:64px;background:repeating-linear-gradient(180deg,#8ea593 0 3px,#98ae9c 3px 6px);box-shadow:inset 1px 0 0 rgba(255,255,255,.2),inset -1px 0 0 rgba(0,0,0,.08)}
.yan.l{left:34%}.yan.r{left:62%}
.sx,.sback{position:absolute;top:14px;border:0;cursor:pointer;font:inherit}
.sx{right:-4px;width:34px;height:34px;border-radius:4px;background:#b1402c;color:#f7eee0;font-size:17px;letter-spacing:0;box-shadow:inset 0 0 0 2px rgba(255,235,210,.35)}
.sx:hover{background:#c24a33}
.sback{left:-4px;height:30px;padding:0 10px;border-radius:15px;background:rgba(247,240,222,.85);color:var(--ink2);font-size:13.5px}
.sback:hover{background:#f7f0de;color:var(--ink)}
.di{position:relative;flex:none;height:40px}
.paper{position:relative;flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:24px 24px 18px;scrollbar-width:thin;scrollbar-color:rgba(120,80,40,.3) transparent;
  background:
    radial-gradient(ellipse at 20% 10%,rgba(255,255,255,.35),transparent 60%),
    repeating-linear-gradient(97deg,rgba(150,120,80,.035) 0 1px,transparent 1px 7px),
    linear-gradient(180deg,#f6efdc,#f1e7cf);
  box-shadow:inset 0 0 0 1px rgba(120,90,50,.28),inset 0 0 36px rgba(170,130,70,.14)}
.pv{writing-mode:vertical-rl;width:calc(100% + 12px);box-sizing:border-box;overflow-x:auto;overflow-y:hidden;margin:0 -6px;padding:4px 6px 8px;scrollbar-width:thin;
  background:repeating-linear-gradient(to left,transparent 0 45px,rgba(177,64,44,.16) 45px 46px)}
.pv .pt{margin:0 0 0 4px;font-weight:400;font-size:27px;letter-spacing:7px;color:#1f1b17;line-height:46px}
.pv .pa{font-size:14.5px;color:var(--ink3);letter-spacing:4px;padding-top:44px;line-height:46px}
.pv .pa em{font-style:normal;color:var(--zhu)}
.pv .ppr{font-size:14px;color:var(--ink2);letter-spacing:2px;line-height:30px;padding-top:28px}
.pv p{margin:0;font-size:22px;line-height:46px;letter-spacing:7px;color:#1f1b17}
.pv .seal2{line-height:46px;text-align:end;padding-bottom:4px}
.pv .seal2 span{display:inline-block;width:46px;height:46px;padding:3px;background:#b1402c;color:#f6ecde;line-height:1.08;letter-spacing:0;
  text-align:center;border-radius:3px;box-shadow:inset 0 0 0 2px rgba(246,236,222,.55),inset 0 0 0 3px #b1402c,inset 0 0 0 4px rgba(246,236,222,.35);vertical-align:bottom}
.pmeta{margin-top:18px;border-top:1px solid rgba(177,64,44,.28);padding-top:4px}
.pmeta h3{margin:18px 0 8px;font-weight:400;font-size:15px;letter-spacing:4px;color:var(--zhu)}
.pmeta h3::before{content:"〔"}.pmeta h3::after{content:"〕"}
.pmeta p{margin:0;font-size:15.5px;line-height:1.95;color:#3b332c;text-align:justify;text-indent:2em}
.pmeta dl{margin:0;font-size:14.5px;line-height:1.8;color:#3b332c}
.pmeta dt{display:inline;color:#1f1b17}
.pmeta dt::after{content:"："}
.pmeta dd{display:inline;margin:0}
.pmeta dd::after{content:"";display:block;margin-bottom:3px}
.pmeta .tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.pmeta .tags span{font-size:13px;color:var(--zhu);border:1px solid rgba(177,64,44,.45);border-radius:2px;padding:1px 7px;letter-spacing:2px}
.pnav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:22px;padding-top:12px;border-top:1px dashed rgba(120,90,50,.3)}
.pnav button{border:1px solid rgba(120,90,50,.3);background:rgba(255,255,255,.35);border-radius:2px;padding:5px 12px;font:inherit;font-size:14px;cursor:pointer;color:var(--ink2)}
.pnav button:hover{background:#fff;color:var(--ink)}
.pnav span{font-size:13px;color:var(--ink3);letter-spacing:2px}
#scroll.unroll .mount{animation:unroll .95s cubic-bezier(.25,.8,.3,1) both}
#scroll.unroll .rod.bot{animation:rodDown .95s cubic-bezier(.25,.8,.3,1) both}
#scroll.rollup .mount{animation:rollup .5s cubic-bezier(.5,0,.8,.4) both}
#scroll.rollup .rod.bot{animation:rodUp .5s cubic-bezier(.5,0,.8,.4) both}
#scroll.unroll .rod.top{animation:fadeIn .25s both}
@keyframes unroll{from{clip-path:inset(0 0 100% 0)}to{clip-path:inset(0 0 0 0)}}
@keyframes rollup{from{clip-path:inset(0 0 0 0)}to{clip-path:inset(0 0 100% 0)}}
@keyframes rodDown{from{transform:translateY(calc(-1 * var(--mh,500px)))}to{transform:none}}
@keyframes rodUp{from{transform:none}to{transform:translateY(calc(-1 * var(--mh,500px)))}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

/* ———— 加载 ———— */
#loader{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 40%,#f3ead6,#e2d5b8);transition:opacity .9s ease}
#loader.done{opacity:0;pointer-events:none}
#loader .in{text-align:center;padding:24px}
#loader .ring{width:76px;height:76px;margin:0 auto 18px;border-radius:50%;
  background:conic-gradient(from 0deg,rgba(39,35,31,0),rgba(39,35,31,.85) 70%,rgba(39,35,31,0));
  -webkit-mask:radial-gradient(circle,transparent 30px,#000 31px,#000 36px,transparent 37px);mask:radial-gradient(circle,transparent 30px,#000 31px,#000 36px,transparent 37px);
  animation:spin 1.6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#loader h2{margin:0;font-family:var(--brush);font-weight:400;font-size:40px;letter-spacing:8px}
#loader .st{margin-top:10px;font-size:13px;color:var(--ink2);letter-spacing:2px;min-height:1.5em}
#loader .bar{width:180px;height:2px;margin:14px auto 0;background:rgba(39,35,31,.12);border-radius:2px;overflow:hidden}
#loader .bar i{display:block;height:100%;width:0;background:var(--zhu);transition:width .3s}
#loader .err{max-width:420px;margin:16px auto 0;font-size:14px;line-height:1.8;color:var(--zhu);display:none}
#loader.fail .ring,#loader.fail .bar{display:none}
#loader.fail .err{display:block}

/* ———— 纸纹 ———— */
#paper{position:fixed;inset:0;pointer-events:none;z-index:1;opacity:.35;mix-blend-mode:multiply;
  background:radial-gradient(ellipse at 50% 45%,transparent 55%,rgba(90,70,40,.22) 100%)}
.night #paper{opacity:.5;mix-blend-mode:normal;background:radial-gradient(ellipse at 50% 45%,transparent 50%,rgba(0,5,15,.45) 100%)}

@media (max-width:760px){
  #brand{left:14px;gap:9px}
  .seal{width:32px;height:32px;font-size:21px}
  #brand h1{font-size:26px;letter-spacing:3px}
  #brand p{font-size:11px;letter-spacing:1px}
  #search{top:calc(78px + env(safe-area-inset-top,0px));right:12px;left:12px;width:auto}
  #search .box{height:38px}
  #results{position:absolute;top:44px;left:0;right:0;margin:0}
  #dock{left:12px;right:12px;bottom:calc(12px + var(--safe-b));max-width:none;justify-content:center;gap:6px}
  .grp{padding:3px}
  .grp .lab{display:none}
  .chip{min-width:32px;padding:0 6px;font-size:13.5px;letter-spacing:0;height:30px}
  .ico{width:34px;height:30px}
  #hint{display:none}
  #scroll{top:calc(26px + env(safe-area-inset-top,0px));left:0;right:0;margin:0 auto;width:calc(100vw - 40px);height:calc(100vh - 44px - var(--safe-b))}
  .mount{padding:0 11px}
  .tian{height:56px}.yan{height:56px}
  .paper{padding:18px 16px 14px}
  .pv p{font-size:20px;letter-spacing:5px}
  .pv .pt{font-size:24px;letter-spacing:5px}
  #plist{left:12px!important;right:12px;top:auto!important;bottom:calc(12px + var(--safe-b));width:auto;max-height:52vh;transform:none!important}
  body.panel-open #dock,body.panel-open #search,body.plist-open #dock,body.plist-open #search{opacity:0;pointer-events:none}
}
@media (max-width:370px){ .chip{min-width:30px;padding:0 6px} .ico{width:31px} }
@media (prefers-reduced-motion:reduce){ *{transition-duration:.01s!important;animation-duration:.01s!important} }
</style>
</head>
<body>
<canvas id="scene" tabindex="0" aria-label="三维山河诗词地图，拖动旋转，滚轮缩放"></canvas>
<div id="paper"></div>
<div id="labels" aria-hidden="true"></div>

<div id="brand" class="chrome">
  <div class="seal">诗</div>
  <div><h1>山河诗卷</h1><p id="stat">先秦至宋 · 诗词地图</p></div>
</div>

<div id="search" class="chrome">

const E = new Float32Array(N);       // 海拔（米）
const LAND = new Float32Array(N);
const TY = new Float32Array(N);      // 体素顶面高度（世界单位）
const WY = new Float32Array(N).fill(NaN);  // 水面高度
const KIND = new Uint8Array(N);      // 0 常规 1 荒漠 2 黄土 3 戈壁 4 高原 5 草原 6 平原
const AMP = new Float32Array(N);

const m2y = (m) => 0.16 + 4.5 * Math.pow(Math.max(0, m) / 1000, 0.78);
const y2m = (y) => 1000 * Math.pow(Math.max(0, y - 0.16) / 4.5, 1 / 0.78);

const rc = document.createElement("canvas"); rc.width = W; rc.height = H;
const rctx = rc.getContext("2d", { willReadFrequently: true });
function raster(polys, out) {
  rctx.clearRect(0, 0, W, H); rctx.fillStyle = "#fff"; rctx.beginPath();
  for (const poly of polys) {
    poly.forEach(([lng, lat], k) => { const x = (wx(lng) - X0) / CS, y = (wz(lat) - Z0) / CS; k ? rctx.lineTo(x, y) : rctx.moveTo(x, y); });
    rctx.closePath();
  }
  rctx.fill("nonzero");
  const d = rctx.getImageData(0, 0, W, H).data;
  out = out || new Float32Array(N);
  for (let k = 0; k < N; k++) out[k] = d[k * 4 + 3] / 255;
  return out;
}
function blur(a, r) {
  r = Math.max(1, Math.round(r));
  const tmp = new Float32Array(N), inv = 1 / (2 * r + 1);
  for (let pass = 0; pass < 2; pass++) {
    for (let j = 0; j < H; j++) {
      let s = 0; const o = j * W;
      for (let i = -r; i <= r; i++) s += a[o + clamp(i, 0, W - 1)];
      for (let i = 0; i < W; i++) { tmp[o + i] = s * inv; s += a[o + Math.min(W - 1, i + r + 1)] - a[o + Math.max(0, i - r)]; }
    }
    for (let i = 0; i < W; i++) {
      let s = 0;
      for (let j = -r; j <= r; j++) s += tmp[clamp(j, 0, H - 1) * W + i];
      for (let j = 0; j < H; j++) { a[j * W + i] = s * inv; s += tmp[Math.min(H - 1, j + r + 1) * W + i] - tmp[Math.max(0, j - r) * W + i]; }
    }
  }
  return a;
}
const deg2cells = (d) => d / UD * 0.72 / CS;
function segDist(px, pz, ax, az, bx, bz) {
  const dx = bx - ax, dz = bz - az, l2 = dx * dx + dz * dz;
  let t = l2 ? ((px - ax) * dx + (pz - az) * dz) / l2 : 0; t = clamp(t, 0, 1);
  const ex = ax + dx * t - px, ez = az + dz * t - pz;
  return [Math.sqrt(ex * ex + ez * ez), t];
}
/** 对折线附近的格子调用 fn(k, 距离, 沿线参数0..1) */
function forPolyline(pts, reach, fn) {
  const P = pts.map(([lng, lat]) => [wx(lng), wz(lat)]);
  const L = [0]; for (let s = 1; s < P.length; s++) L.push(L[s - 1] + Math.hypot(P[s][0] - P[s - 1][0], P[s][1] - P[s - 1][1]));
  const tot = L[L.length - 1] || 1;
  let minx = Infinity, maxx = -Infinity, minz = Infinity, maxz = -Infinity;
  P.forEach(([x, z]) => { minx = Math.min(minx, x); maxx = Math.max(maxx, x); minz = Math.min(minz, z); maxz = Math.max(maxz, z); });
  const i0 = Math.max(0, gi(minx - reach)), i1 = Math.min(W - 1, gi(maxx + reach));
  const j0 = Math.max(0, gj(minz - reach)), j1 = Math.min(H - 1, gj(maxz + reach));
  for (let j = j0; j <= j1; j++) for (let i = i0; i <= i1; i++) {
    const x = cx(i), z = cz(j); let best = Infinity, bt = 0;
    for (let s = 1; s < P.length; s++) {
      const [d, t] = segDist(x, z, P[s - 1][0], P[s - 1][1], P[s][0], P[s][1]);
      if (d < best) { best = d; bt = (L[s - 1] + t * (L[s] - L[s - 1])) / tot; }
    }
    if (best < reach) fn(j * W + i, best, bt);
  }
  return { P, L, tot };
}

async function buildHeights() {
  await stage("铺纸 · 勾勒海岸", 6);
  raster(window.LAND_RINGS || [], LAND);
  const sea1 = raster([SEA]), sea2 = raster([SEA2]);
  for (let k = 0; k < N; k++) LAND[k] = Math.max(LAND[k], 1 - Math.max(sea1[k], sea2[k]));
  for (let k = 0; k < N; k++) LAND[k] = LAND[k] > 0.5 ? 1 : 0;
  const landBlur = blur(Float32Array.from(LAND), deg2cells(0.5));
  const coastFade = blur(Float32Array.from(LAND), deg2cells(1.1));

  await stage("起笔 · 高原与盆地", 14);
  const base = new Float32Array(N).fill(160); AMP.fill(430);
  const kindW = new Float32Array(N), caps = [];
  for (const [poly, h, bl, amp, kind] of REGIONS) {
    const m = blur(raster([poly]), deg2cells(bl));
    const raw = kind ? raster([poly]) : null;
    if (kind === "plain" || (h != null && h < 500 && !kind)) caps.push([blur(raster([poly]), deg2cells(0.12)), h]);
    for (let k = 0; k < N; k++) {
      const t = m[k]; if (t <= 0) continue;
      if (h != null) base[k] = lerp(base[k], h, t);
      if (amp != null) AMP[k] = lerp(AMP[k], amp, t);
      if (kind && raw[k] > 0.5 && t > kindW[k] * 0.9) {
        KIND[k] = { desert: 1, loess: 2, gobi: 3, plateau: 4, steppe: 5, plain: 6 }[kind]; kindW[k] = t;
      }
    }
  }
  await stage("皴擦 · 群山", 24);
  for (let j = 0; j < H; j++) for (let i = 0; i < W; i++) {
    const k = j * W + i, x = cx(i), z = cz(j);
    let n = fbm(nA, x * 0.035, z * 0.035, 5) * 0.5 + 0.5;
    n = Math.pow(clamp(n, 0, 1), 1.35);
    let e = base[k] + AMP[k] * n * 1.25 - AMP[k] * 0.18;
    if (KIND[k] === 1) e += 90 * Math.pow(1 - Math.abs(nB(x * 0.16 + nC(x * 0.05, z * 0.05) * 1.5, z * 0.35)), 3) * (0.4 + 0.6 * (0.5 + 0.5 * nC(x * 0.04, z * 0.04)));
    if (KIND[k] === 3 || KIND[k] === 5) e += 110 * Math.pow(0.5 + 0.5 * nB(x * 0.11 + nC(x * 0.04, z * 0.04), z * 0.13), 2);
    if (base[k] < 600) e += 38 * nA(x * 0.5, z * 0.5) * (1 - smooth(300, 600, base[k]));
    E[k] = e;
  }
  const ridgeN = (x, z) => ridged(nB, x * 0.06, z * 0.06, 3);
  for (const [pts, h, wdeg] of RANGES) {
    const mid = pts[pts.length >> 1], w = wdeg / UD * scaleAt(mid[0], mid[1]);
    forPolyline(pts, w * 2.6, (k, d) => {
      const x = cx(k % W), z = cz((k / W) | 0);
      const fall = Math.exp(-(d / w) * (d / w) * 1.1);
      const along = 0.62 + 0.38 * (0.5 + 0.5 * nD(x * 0.05, z * 0.05));
      E[k] += h * fall * along * (0.38 + 0.8 * ridgeN(x, z));
    });
  }
  for (const [lng, lat, h, wdeg] of PEAKS) {
    const w = Math.max(0.3, wdeg * 1.6) / UD * scaleAt(lng, lat);
    forPolyline([[lng, lat], [lng + 0.0001, lat]], w * 2.6, (k, d) => {
      const x = cx(k % W), z = cz((k / W) | 0);
      E[k] += h * 0.8 * Math.exp(-(d / w) * (d / w) * 1.3) * (0.55 + 0.6 * ridgeN(x * 1.3, z * 1.3));
    });
  }
  /* 平原与盆地压住山势，山前界线分明 */
  for (const [m, h] of caps) for (let k = 0; k < N; k++) if (m[k] > 0) E[k] = lerp(E[k], Math.min(E[k], h + 140 + AMP[k] * 0.3), m[k]);
  /* 轻柔化：去掉单格尖柱 */
  { const T = Float32Array.from(E);
    for (let j = 1; j < H - 1; j++) for (let i = 1; i < W - 1; i++) { const k = j * W + i;
      const a = (T[k - 1] + T[k + 1] + T[k - W] + T[k + W]) * 0.1 + (T[k - W - 1] + T[k - W + 1] + T[k + W - 1] + T[k + W + 1]) * 0.05;
      E[k] = T[k] * 0.4 + a; } }  // 权重和为 1
  /* 陆地 → 世界高度；海洋 → 海床。近海处地势渐低，海岸成滩而非断崖 */
  for (let k = 0; k < N; k++) {
    if (LAND[k]) { const f = smooth(0.45, 0.9, coastFade[k]); E[k] = E[k] * (0.08 + 0.92 * f) + 20 * (1 - f); }
    if (LAND[k]) TY[k] = m2y(E[k]);
    else { TY[k] = -0.22 - (1 - landBlur[k]) * 2.6 - 0.3 * Math.abs(nC(cx(k % W) * 0.05, cz((k / W) | 0) * 0.05)); WY[k] = 0; }
  }

  await stage("引水 · 江河湖泊", 38);
  /* 江河：沿线采样 → 单调不升的水位 → 开凿河道 */
  for (const [pts, w0, w1] of RIVERS) {
    const P = pts.map(([lng, lat]) => [wx(lng), wz(lat)]);
    const samples = [];
    for (let s = 1; s < P.length; s++) {
      const n = Math.max(1, Math.ceil(Math.hypot(P[s][0] - P[s - 1][0], P[s][1] - P[s - 1][1]) / 0.5));
      for (let q = 0; q < n; q++) { const t = q / n; samples.push([lerp(P[s - 1][0], P[s][0], t), lerp(P[s - 1][1], P[s][1], t)]); }
    }
    samples.push(P[P.length - 1]);
    const lvl = samples.map(([x, z]) => {
      const i = clamp(gi(x), 0, W - 1), j = clamp(gj(z), 0, H - 1); const k = j * W + i;
      return LAND[k] ? TY[k] - 0.28 : 0;
    });
    for (let s = 1; s < lvl.length; s++) lvl[s] = Math.min(lvl[s], lvl[s - 1]);
    for (let it = 0; it < 3; it++) for (let s = 1; s < lvl.length - 1; s++) lvl[s] = Math.min(lvl[s], (lvl[s - 1] + lvl[s] + lvl[s + 1]) / 3);
    for (let s = 0; s < lvl.length; s++) lvl[s] = Math.max(0.04, lvl[s]);
    const nS = samples.length;
    const hwOf = (t) => Math.max(CS * 0.74, lerp(w0 * 0.75, w1, Math.pow(t, 3)));
    forPolyline(pts, Math.max(hwOf(0), hwOf(1)) + 3.2, (k, d, t) => {
      const hw = hwOf(t);
      const s = clamp(Math.round(t * (nS - 1)), 0, nS - 1), L = lvl[s];
      if (!LAND[k]) return;
      if (d < hw) {
        const bed = L - 0.35 - 0.4 * (1 - d / hw);

        WY[k] = isNaN(WY[k]) ? L : Math.min(WY[k], L);
      } else {
        const bw = lerp(3.0, 0.7, smooth(0.8, 3.5, TY[k] - L));
        const bank = L + 0.16 + (TY[k] - L - 0.16) * smooth(hw, hw + bw, d);
        if (TY[k] > bank) TY[k] = bank;

  for (let [lng, lat, rx, rz, rot] of LAKES) {
    const ls = 1.25 * scaleAt(lng, lat); rx *= ls; rz *= ls;
    const x0 = wx(lng), z0 = wz(lat), R = Math.max(rx, rz) + 3;
    const c = Math.cos(rot), s = Math.sin(rot);

  const src = ac.createBufferSource(); src.buffer = nb; src.loop = true;
  const lp = ac.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 420; lp.Q.value = 0.6;

  const bp = ac.createBiquadFilter(); bp.type = "bandpass"; bp.frequency.value = 900; bp.Q.value = 0.4;
  const wg2 = ac.createGain(); wg2.gain.value = 0.018; ws.connect(bp); bp.connect(wg2); wg2.connect(master); ws.start();

  for (let c = 0; c < 2; c++) { const ch = ir.getChannelData(c); for (let i = 0; i < rl; i++) ch[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / rl, 2.6); }

    if (!audio) return;
    const t = ac.currentTime + 0.05, f = scale[(Math.random() * scale.length) | 0];
    const notes = Math.random() < 0.3 ? [f, f * 1.5] : [f];
    notes.forEach((fr, n) => {

    });

  }

}

const clock = new THREE.Clock();

    const t = GU.uTime.value;

  ring.visible = ringMat.opacity > 0.01;

}

  if (!perfChecked && frames > 30) {
    perfAcc += dt; perfN++;
    if (perfN === 120) {

      const fps = perfN / perfAcc;

      if (fps < 26 && QUALITY !== "low" && !QS.get("q")) { QUALITY = QUALITY === "high" ? "mid" : "low"; applyQuality(); toast("帧率偏低，已自动切换到「" + QPRE[QUALITY].name + "」画质"); }
